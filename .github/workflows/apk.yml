name: Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur (Android API 34 ve Gradle Icin Zorunlu)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem Bagimliliklarini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            libltdl-dev patch

      - name: Buildozer ve Cython Kur
        run: |
          python3 -m pip install --upgrade pip "setuptools<70.0.0" wheel
          python3 -m pip install "cython==0.29.36" buildozer

      - name: Buildozer Onbellegini Yukle
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: lugat-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: APK Derle
        run: |
          yes | buildozer android debug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: lugat-debug-apk
          path: bin/*.apk
